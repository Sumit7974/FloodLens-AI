# Render Infrastructure-as-Code Blueprint for FloodLens AI (Free Tier)
# Provisions:
# 1. Managed PostgreSQL 16 instance with PostGIS support
# 2. FastAPI Web API Service built from Dockerfile with auto-migrations
databases:
  - name: floodlens-postgis
    databaseName: floodlens_db
    user: floodlens_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: floodlens-backend
    runtime: docker
    plan: free
    region: oregon
    branch: feature/hackathon-deployment-rc
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: OPERATIONAL_MODE
        value: historical_demo
      - key: DATABASE_URL
        fromDatabase:
          name: floodlens-postgis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,http://localhost:8081,https://floodlens.org"
      - key: FLOODLENS_REPO_ROOT
        value: /app
      - key: PYTHONPATH
        value: /app/backend:/app
      - key: DEMO_AUTHORITY_PASSWORD
        sync: false
      - key: DEMO_CITIZEN_PASSWORD
        sync: false
