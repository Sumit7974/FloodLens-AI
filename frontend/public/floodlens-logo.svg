<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="100%">
  <defs>
    <!-- Dark canvas background gradient -->
    <radialGradient id="spaceGaze" cx="15%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="60%" stop-color="#04060a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Synthetic Aperture Radar & NDWI Spectrum Gradients -->
    <linearGradient id="orbitCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="surgePulse" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="apertureGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Core Focal Iris Gradients -->
    <radialGradient id="irisCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#67e8f9" />
      <stop offset="70%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>

    <!-- Luminous Filters -->
    <filter id="bloomSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#spaceGaze)" rx="12" />

  <!-- Subtle Precision Geodetic Crosshairs (Background) -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.6">
    <line x1="86" y1="14" x2="86" y2="146" stroke-dasharray="3 4" />
    <line x1="20" y1="80" x2="152" y2="80" stroke-dasharray="3 4" />
    <circle cx="86" cy="80" r="66" fill="none" stroke="#0f172a" stroke-width="1" />
  </g>

  <!-- ==================== LOGOMARK: THE ORBITAL FLOOD LENS ==================== -->
  <g transform="translate(6, 0)">
    
    <!-- Outer Sentinel Synthetic Aperture Bracket (Telemetry Framing) -->
    <!-- Top-Left Sensor Reticle -->
    <path d="M 52 38 L 40 38 L 40 50" fill="none" stroke="#06b6d4" stroke-width="1.75" stroke-linecap="round" />
    <!-- Top-Right Sensor Reticle -->
    <path d="M 108 38 L 120 38 L 120 50" fill="none" stroke="#06b6d4" stroke-width="1.75" stroke-linecap="round" />
    <!-- Bottom-Left Sensor Reticle -->
    <path d="M 40 110 L 40 122 L 52 122" fill="none" stroke="#06b6d4" stroke-width="1.75" stroke-linecap="round" />
    <!-- Bottom-Right Warning Trigger Reticle (Surge Indication) -->
    <path d="M 120 110 L 120 122 L 108 122" fill="none" stroke="#f43f5e" stroke-width="1.75" stroke-linecap="round" />

    <!-- Orbital Lens Sweep Ring (45° Tilt Synthetic Radar Track) -->
    <ellipse cx="80" cy="80" rx="55" ry="22" transform="rotate(-28 80 80)" fill="none" stroke="url(#orbitCyan)" stroke-width="1.5" stroke-dasharray="140 28 12 18" filter="url(#bloomSoft)" />

    <!-- Outer Hydro-Optical Aperture (The "Lens Eye") -->
    <path d="M 36 80 C 48 54, 112 54, 124 80 C 112 106, 48 106, 36 80 Z" fill="none" stroke="#0e7490" stroke-width="1.25" opacity="0.8" />

    <!-- Flood Crest Dynamic Arc (Upper Inundation Boundary) -->
    <path d="M 42 79 C 55 58, 105 58, 118 79" fill="none" stroke="url(#surgePulse)" stroke-width="3" stroke-linecap="round" filter="url(#bloomSoft)" />

    <!-- Lower Tidal Resiliency Ripple (Dual Frequency SAR Echo) -->
    <path d="M 46 83 C 58 101, 102 101, 114 83" fill="none" stroke="url(#orbitCyan)" stroke-width="2" stroke-linecap="round" stroke-dasharray="32 6 8 4" />

    <!-- Concentric Flood Level Iso-Contours (Topographic Water Rise) -->
    <path d="M 54 80 C 62 67, 98 67, 106 80 C 98 93, 62 93, 54 80 Z" fill="url(#apertureGlow)" stroke="#22d3ee" stroke-width="0.75" stroke-dasharray="2 3" />

    <!-- Central Neural Optical Core (Satellite Focal Target) -->
    <circle cx="80" cy="80" r="13" fill="url(#irisCore)" filter="url(#laserGlow)" />
    <circle cx="80" cy="80" r="4.5" fill="#ffffff" />
    
    <!-- Radar Vector Sweep Ray -->
    <line x1="80" y1="80" x2="119" y2="46" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="119" cy="46" r="2.2" fill="#38bdf8" filter="url(#bloomSoft)" />

    <!-- Elevation Calibration Indices -->
    <circle cx="80" cy="27" r="1.5" fill="#06b6d4" />
    <circle cx="80" cy="133" r="1.5" fill="#0891b2" />
  </g>

  <!-- ==================== TYPOGRAPHIC WORDMARK ==================== -->
  <g transform="translate(168, 0)">
    
    <!-- Primary Title: FLOODLENS -->
    <text x="0" y="93" font-family="'D-DIN', 'DIN Alternate', 'Arial Narrow', sans-serif" font-size="52" font-weight="700" letter-spacing="4" fill="#ffffff">
      FLOOD<tspan fill="#38bdf8">LENS</tspan>
    </text>

    <!-- AI Multi-Mission Badge Container -->
    <g transform="translate(348, 51)">
      <!-- Cybernetic Framing Box -->
      <rect x="0" y="0" width="62" height="46" rx="4" fill="#082f49" fill-opacity="0.45" stroke="#0284c7" stroke-width="1.5" />
      
      <!-- Corner Bracket Highlighters -->
      <path d="M 0 8 L 0 0 L 8 0" fill="none" stroke="#38bdf8" stroke-width="2" />
      <path d="M 54 46 L 62 46 L 62 38" fill="none" stroke="#38bdf8" stroke-width="2" />

      <!-- "AI" Glyphs -->
      <text x="31" y="32" font-family="'D-DIN', 'DIN Alternate', 'Arial Narrow', sans-serif" font-size="28" font-weight="800" letter-spacing="2.5" text-anchor="middle" fill="#ffffff" filter="url(#bloomSoft)">
        AI
      </text>

      <!-- Active Neural Indicator Pulse -->
      <circle cx="53" cy="9" r="2.5" fill="#f43f5e" filter="url(#bloomSoft)" />
    </g>

    <!-- Mission Eyebrow / Geospatial System Descriptor -->
    <text x="2" y="122" font-family="'D-DIN', 'DIN Alternate', 'Arial Narrow', -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="3.2" fill="#94a3b8">
      PREDICT &amp; PROTECT <tspan fill="#0284c7">//</tspan> DETECT &amp; RESPOND <tspan fill="#0284c7">//</tspan> RETRAIN
    </text>

    <!-- Precision Telemetry Line Element -->
    <line x1="2" y1="133" x2="408" y2="133" stroke="#1e293b" stroke-width="1" />
    <line x1="2" y1="133" x2="78" y2="133" stroke="#06b6d4" stroke-width="1.5" />
  </g>

</svg>
