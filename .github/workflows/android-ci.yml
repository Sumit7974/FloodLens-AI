name: Android Citizen App CI

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'mobile/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android-ci.yml'

jobs:
  android-js-validation:
    name: Expo TypeScript and Android bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Expo dependencies and doctor
        run: |
          npx expo install --check
          npx expo-doctor
      - name: Typecheck
        run: npm run typecheck
      - name: Export Android JavaScript bundle
        run: npm run export
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8000
