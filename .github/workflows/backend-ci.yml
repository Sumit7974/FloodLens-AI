name: Backend CI & PostGIS Integration

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Test & PostGIS 16 Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: floodlens_test_db
          POSTGRES_USER: floodlens_user
          POSTGRES_PASSWORD: floodlens_secure_password_test_12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql+psycopg2://floodlens_user:floodlens_secure_password_test_12345@localhost:5432/floodlens_test_db
      TEST_DATABASE_URL: postgresql+psycopg2://floodlens_user:floodlens_secure_password_test_12345@localhost:5432/floodlens_test_db
      JWT_SECRET: ci-secure-jwt-secret-testing-32-chars-floodlens
      DEBUG: "false"
      DEMO_AUTHORITY_PASSWORD: CIPostGISTestAuthPassword123!
      DEMO_CITIZEN_PASSWORD: CIPostGISTestCitizenPassword123!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            ml/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client libpq-dev jq

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install -r ml/requirements.txt

      - name: Verify PostgreSQL 16 & PostGIS extension
        env:
          PGPASSWORD: floodlens_secure_password_test_12345
        run: |
          pg_isready -h localhost -p 5432 -U floodlens_user -d floodlens_test_db
          psql -h localhost -p 5432 -U floodlens_user -d floodlens_test_db -c "SELECT version();"
          psql -h localhost -p 5432 -U floodlens_user -d floodlens_test_db -c "SELECT PostGIS_Full_Version();"

      - name: Run live Alembic migrations (upgrade head)
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Verify migration reversibility (downgrade base and re-upgrade)
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run live PostGIS 16 spatial queries and index verification
        working-directory: backend
        run: |
          python scripts/verify_spatial_postgis.py

      - name: Run live PostGIS ML forecast persistence integration test
        working-directory: backend
        run: |
          pytest -v -s tests/test_ml_postgis_integration.py

      - name: Verify PostGIS seeding, idempotency, and historical demo integration
        working-directory: backend
        run: |
          python scripts/seed_historical_demo_data.py
          python scripts/seed_historical_demo_data.py
          pytest -v tests/test_postgis_seed_verification.py

      - name: Run full pytest suite against PostGIS
        working-directory: backend
        run: |
          pytest -v --tb=short

      - name: Test live FastAPI startup & readiness probe
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          UVICORN_PID=$!
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8000/api/v1/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo "Testing GET /api/v1/health..."
          curl -fsS http://127.0.0.1:8000/api/v1/health | jq .
          echo "Testing GET /api/v1/ready..."
          curl -fsS http://127.0.0.1:8000/api/v1/ready | jq .
          echo "Testing GET /ready alias..."
          curl -fsS http://127.0.0.1:8000/ready | jq .
          kill $UVICORN_PID

